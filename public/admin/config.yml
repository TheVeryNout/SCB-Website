backend:
  name: git-gateway
  branch: master

local_backend:
  url: http://127.0.0.1:4335/api/v1
  allowed_hosts:
    - 127.0.0.1
    - localhost

locale: de
media_folder: "src/assets/images/uploads"
public_folder: "/src/assets/images/uploads"

collections:
  - name: "site-settings"
    label: "Website-Einstellungen"
    delete: false
    editor:
      preview: false
    files:
      - file: "src/content/settings/site-settings.md"
        label: "Allgemein"
        name: "site_settings"
        fields:
          - { label: "Organisationsname", name: "organizationName", widget: "string" }
          - { label: "Kurzbeschreibung", name: "siteDescription", widget: "text" }
          - { label: "Kontakt-E-Mail", name: "contactEmail", widget: "string" }
          - { label: "Telefon", name: "contactPhone", widget: "string", required: false }
          - { label: "WhatsApp", name: "whatsApp", widget: "string", required: false }
          - { label: "Postanschrift", name: "postalAddress", widget: "text" }
          - label: "Social Links"
            name: "socialLinks"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "Wiederverwendete Social-Links für Footer und Kontaktflächen."
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - { label: "Spendenhinweis", name: "donationDetails", widget: "text", required: false }
          - { label: "Footer-Notiz", name: "footerNote", widget: "text", required: false }

  - name: "homepage"
    label: "Startseite"
    delete: false
    editor:
      preview: false
    files:
      - file: "src/content/homepage/home.md"
        label: "Startseite"
        name: "home"
        fields:
          - { label: "Seitentitel", name: "title", widget: "string" }
          - { label: "Hero-Titel", name: "heroTitle", widget: "string" }
          - { label: "Hero-Intro", name: "heroIntro", widget: "text" }
          - { label: "Hero-Bild", name: "heroImage", widget: "image", required: false }
          - label: "Featured Announcement (Optional)"
            name: "featuredAnnouncement"
            widget: "object"
            required: false
            collapsed: true
            hint: "Optionaler Hinweisblock für eine einzelne wichtige Meldung. Mit dem Schalter kann der Block ausgeblendet werden, ohne die Felder zu löschen."
            fields:
              - { label: "Auf Startseite anzeigen", name: "enabled", widget: "boolean", default: true, required: false }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Link-Label", name: "linkLabel", widget: "string", required: false }
              - { label: "Link-URL", name: "linkUrl", widget: "string", required: false }
          - { label: "Mitgliedschaft Titel", name: "membershipCtaTitle", widget: "string", required: false }
          - { label: "Mitgliedschaft Text", name: "membershipCtaText", widget: "text", required: false }
          - { label: "Mitgliedschaft Button", name: "membershipCtaLabel", widget: "string", required: false }
          - { label: "Medien Titel", name: "mediaTeaserTitle", widget: "string", required: false }
          - { label: "Medien Text", name: "mediaTeaserText", widget: "text", required: false }
          - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "pages"
    label: "Seiten"
    delete: false
    editor:
      preview: false
    files:
      - file: "src/content/pages/about.md"
        label: "Über uns"
        name: "about"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Hero-Bild", name: "heroImage", widget: "image", required: false }
          - label: "Vereinsziele"
            name: "goals"
            widget: "list"
            hint: "Kurze, einzelne Ziele statt freier Textliste."
            field: { label: "Ziel", name: "goal", widget: "string" }
          - label: "Vorstand"
            name: "boardMembers"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Rolle", name: "role", widget: "string" }
              - { label: "Bild", name: "image", widget: "image", required: false }
          - { label: "Satzung PDF", name: "statutesPdf", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "src/content/pages/membership.md"
        label: "Mitgliedschaft"
        name: "membership"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Vorteile"
            name: "benefits"
            widget: "list"
            field: { label: "Vorteil", name: "benefit", widget: "string" }
          - label: "Anleitung"
            name: "applicationInstructions"
            widget: "list"
            field: { label: "Schritt", name: "step", widget: "string" }
          - { label: "Mitgliedsantrag PDF", name: "membershipFormPdf", widget: "string" }
          - label: "Hinweise"
            name: "notes"
            widget: "list"
            required: false
            field: { label: "Hinweis", name: "note", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown", required: false }

      - file: "src/content/pages/contact.md"
        label: "Kontakt"
        name: "contact"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Ort", name: "locationName", widget: "string" }
          - { label: "Kartenlink", name: "mapUrl", widget: "string", hint: "Externer Kartenlink, kein Embed." }
          - { label: "Adress-Override", name: "addressOverride", widget: "text", required: false }
          - { label: "Kartenbild", name: "mapImage", widget: "image", required: false }
          - { label: "Ortshinweis", name: "locationNotes", widget: "text", required: false }
          - { label: "Body", name: "body", widget: "markdown", required: false }

      - file: "src/content/pages/events.md"
        label: "Veranstaltungen"
        name: "events"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
          - { label: "Terminlisten-Titel", name: "listTitle", widget: "string", required: false }
          - { label: "Terminlisten-Intro", name: "listIntro", widget: "text", required: false }
          - label: "Zusatzinfos"
            name: "additionalInfo"
            widget: "object"
            required: false
            collapsed: true
            hint: "Optionaler Infokasten auf der Veranstaltungsübersicht."
            fields:
              - { label: "Anzeigen", name: "enabled", widget: "boolean", default: false, required: false }
              - { label: "Label", name: "label", widget: "string", default: "Zusatzinfos", required: false }
              - { label: "Titel", name: "title", widget: "string", required: false }
              - { label: "Text", name: "text", widget: "text", required: false }

      - file: "src/content/pages/impressum.md"
        label: "Impressum"
        name: "impressum"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "src/content/pages/datenschutz.md"
        label: "Datenschutz"
        name: "datenschutz"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "posts"
    label: "Neuigkeiten"
    label_singular: "Beitrag"
    folder: "src/content/posts"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{fields.title}}"
    editor:
      preview: true
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Entwurf", name: "draft", widget: "boolean", default: true, required: false, hint: "Entwürfe sind auf der Website nicht sichtbar. Bestehende Beiträge ohne dieses Feld bleiben veröffentlicht." }
      - { label: "Veröffentlicht am", name: "publishedAt", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Kurztext", name: "excerpt", widget: "text" }
      - { label: "Cover-Bild", name: "coverImage", widget: "image", required: false, hint: "Optionales Hauptbild für Übersicht und Beitragskopf." }
      - { label: "Cover-Alternativtext", name: "coverAlt", widget: "string", required: false, hint: "Kurze Bildbeschreibung für Screenreader. Sobald ein Cover gepflegt wird, ist dieser Text erforderlich." }
      - { label: "Cover-Bildunterschrift", name: "coverCaption", widget: "string", required: false }
      - label: "Cover-Darstellung"
        name: "coverMode"
        widget: "select"
        default: "wide"
        options:
          - { label: "Breit zugeschnitten", value: "wide" }
          - { label: "Hochformat", value: "portrait" }
          - { label: "Vollständig / Dokument", value: "contained" }
      - label: "Galeriebilder"
        name: "gallery"
        widget: "gallery-batch"
        required: false
        label_singular: "Bild"
        collapsed: true
        summary: "{{fields.alt}}"
        hint: "Mit „Mehrere Bilder auf einmal hinzufügen“ wählst du viele Fotos in einem Schritt, mit „Bild hinzufügen“ eins. Ziehe die Einträge am Griff, um ihre Reihenfolge zu ändern. Zu jedem Bild ist eine Bildbeschreibung Pflicht: Öffne den Eintrag und fülle sie aus."
        fields:
          - { label: "Foto auswählen", name: "image", widget: "image", choose_url: false }
          - { label: "Bildbeschreibung", name: "alt", widget: "string", hint: "Pflichtfeld: Beschreibe kurz, was auf dem Bild zu sehen ist. Dieser Text hilft Menschen, die das Bild nicht sehen können." }
          - { label: "Sichtbare Bildunterschrift", name: "caption", widget: "string", required: false, hint: "Optional: Dieser Text wird öffentlich unter dem Bild angezeigt." }
      - { label: "Diese Bilder auch unter „Pics n Vids“ anzeigen", name: "showGalleryOnMediaPage", widget: "boolean", default: false, required: false, hint: "Nur veröffentlichte Beiträge mit Bildern erscheinen zusätzlich auf der Seite Pics n Vids." }
      - { label: "Kategorie", name: "category", widget: "string", required: false, hint: "Optional und bewusst einfach gehalten." }
      - { label: "Aktualisiert am", name: "updatedAt", widget: "datetime", required: false, format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Quell-URL", name: "sourceUrl", widget: "string", required: false, hint: "Interne Herkunftsangabe; wird nicht als Teil des Beitragstexts angezeigt." }
      - { label: "Beitragstext", name: "body", widget: "markdown" }

  - name: "events"
    label: "Veranstaltungen"
    label_singular: "Veranstaltung"
    folder: "src/content/events"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{fields.slug}}"
    summary: "{{fields.title}}"
    editor:
      preview: false
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Kurzbeschreibung", name: "summary", widget: "text" }
      - { label: "Status", name: "status", widget: "select", default: "scheduled", options: ["scheduled", "cancelled", "postponed", "tentative"] }
      - { label: "Sichtbarkeit", name: "visibility", widget: "select", default: "public", options: ["public", "hidden"] }
      - { label: "Startdatum", name: "startDate", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Startzeit", name: "startTime", widget: "string", default: "10:00", hint: "24-Stunden-Format, z.B. 10:00" }
      - { label: "Enddatum", name: "endDate", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Endzeit", name: "endTime", widget: "string", default: "12:00", hint: "24-Stunden-Format, z.B. 12:00" }
      - { label: "Zeitzone", name: "timezone", widget: "hidden", default: "Europe/Berlin" }
      - label: "Wiederholung"
        name: "recurrence"
        widget: "object"
        collapsed: true
        hint: "Für den Start nur keine Wiederholung, wöchentlich oder gleicher Tag pro Monat."
        fields:
          - { label: "Typ", name: "type", widget: "select", default: "none", options: ["none", "weekly", "monthly"] }
          - { label: "Intervall", name: "interval", widget: "number", default: 1, value_type: "int", min: 1, required: false, hint: "1 = jede Woche / jeden Monat. Leer wird wie 1 behandelt." }
          - label: "Wochentage"
            name: "daysOfWeek"
            widget: "select"
            multiple: true
            required: false
            hint: "Nur für wöchentliche Termine. Wenn leer, wird der Wochentag aus dem Startdatum verwendet."
            options: ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
          - { label: "Tag im Monat", name: "dayOfMonth", widget: "number", required: false, value_type: "int", min: 1, max: 31 }
          - { label: "Bis einschließlich", name: "until", widget: "date", required: false, format: "YYYY-MM-DD" }
          - { label: "Maximale Anzahl", name: "count", widget: "number", required: false, value_type: "int", min: 1 }
          - label: "Ausnahmen"
            name: "exclusions"
            widget: "list"
            required: false
            field: { label: "Datum", name: "date", widget: "date", format: "YYYY-MM-DD" }
          - label: "Zusatztermine"
            name: "inclusions"
            widget: "list"
            required: false
            field: { label: "Datum", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Ort", name: "locationName", widget: "string" }
      - { label: "Adresse", name: "address", widget: "text", required: false }
      - { label: "Kartenlink", name: "mapUrl", widget: "string", required: false }
      - label: "Zusatzinfos"
        name: "additionalInfo"
        widget: "object"
        required: false
        collapsed: true
        hint: "Optionaler Infokasten auf der Termin-Detailseite. Nicht nur für Wetter gedacht."
        fields:
          - { label: "Anzeigen", name: "enabled", widget: "boolean", default: false, required: false }
          - { label: "Label", name: "label", widget: "string", default: "Zusatzinfos", required: false }
          - { label: "Titel", name: "title", widget: "string", required: false }
          - { label: "Text", name: "text", widget: "text", required: false }
      - { label: "CTA Label", name: "ctaLabel", widget: "string", required: false }
      - { label: "CTA URL", name: "ctaUrl", widget: "string", required: false }
      - { label: "Anmeldung URL", name: "registrationUrl", widget: "string", required: false }
      - { label: "Instagram URL", name: "instagramUrl", widget: "string", required: false }
      - { label: "Bild", name: "heroImage", widget: "image", required: false }
      - label: "Galeriebilder"
        name: "gallery"
        widget: "gallery-batch"
        required: false
        label_singular: "Bild"
        collapsed: true
        summary: "{{fields.alt}}"
        hint: "Mit „Mehrere Bilder auf einmal hinzufügen“ wählst du viele Fotos in einem Schritt, mit „Bild hinzufügen“ eins. Ziehe die Einträge am Griff, um ihre Reihenfolge zu ändern."
        fields:
          - { label: "Foto auswählen", name: "image", widget: "image", choose_url: false }
          - { label: "Bildbeschreibung", name: "alt", widget: "string", hint: "Pflichtfeld: Beschreibe kurz, was auf dem Bild zu sehen ist." }
          - { label: "Sichtbare Bildunterschrift", name: "caption", widget: "string", required: false }
      - { label: "Quelle", name: "source", widget: "hidden", default: "website" }
      - { label: "Quell-ID", name: "sourceId", widget: "hidden", required: false }
      - { label: "Zuletzt geprüft", name: "lastVerifiedAt", widget: "date", required: false, format: "YYYY-MM-DD" }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "media-galleries"
    label: "Pics n Vids"
    label_singular: "Fotogalerie"
    folder: "src/content/media/galleries"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{fields.title}}"
    editor:
      preview: false
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Typ", name: "type", widget: "hidden", default: "photo-gallery" }
      - label: "Galeriebilder"
        name: "gallery"
        widget: "gallery-batch"
        label_singular: "Bild"
        collapsed: true
        summary: "{{fields.alt}}"
        hint: "Mit „Mehrere Bilder auf einmal hinzufügen“ wählst du viele Fotos in einem Schritt, mit „Bild hinzufügen“ eins. Ziehe die Einträge am Griff, um ihre Reihenfolge zu ändern. Zu jedem Bild ist eine Bildbeschreibung Pflicht: Öffne den Eintrag und fülle sie aus."
        fields:
          - { label: "Foto auswählen", name: "image", widget: "image", choose_url: false }
          - { label: "Bildbeschreibung", name: "alt", widget: "string", hint: "Pflichtfeld: Beschreibe kurz, was auf dem Bild zu sehen ist. Dieser Text hilft Menschen, die das Bild nicht sehen können." }
          - { label: "Sichtbare Bildunterschrift", name: "caption", widget: "string", required: false, hint: "Optional: Dieser Text wird öffentlich unter dem Bild angezeigt." }
      - { label: "Kurztext", name: "summary", widget: "text", required: false }
      - { label: "Veröffentlicht am", name: "publishedAt", widget: "datetime", required: false, format: "YYYY-MM-DDTHH:mm:ssZ" }

  - name: "media-videos"
    label: "Videos"
    delete: false
    editor:
      preview: false
    files:
      - file: "src/content/media/skateclub-biriciana-videos.md"
        label: "YouTube-Playlist"
        name: "youtube_playlist"
        fields:
          - { label: "Titel", name: "title", widget: "hidden", default: "SkateClub Biriciana" }
          - { label: "Typ", name: "type", widget: "hidden", default: "youtube" }
          - { label: "YouTube-Playlist-URL", name: "youtubeUrl", widget: "string", hint: "Vollständige URL der Playlist, die auf Pics n Vids eingebettet wird." }
